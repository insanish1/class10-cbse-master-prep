<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Class 10 CBSE Master Prep</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#dfe4ec;--brand:#3157d5;--brand2:#1f3fae;--good:#16835b;--bad:#c0392b;--soft:#eef2ff;--shadow:0 10px 30px rgba(25,35,60,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{background:#111a2e;color:#fff;padding:18px 22px;position:sticky;top:0;z-index:10}.topin{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:800;font-size:20px}.tag{font-size:12px;color:#b9c3d8}.wrap{max-width:1200px;margin:28px auto;padding:0 18px}.hero{background:linear-gradient(135deg,#17264a,#3157d5);color:#fff;border-radius:24px;padding:30px;box-shadow:var(--shadow)}.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;color:#dbe4ff;max-width:800px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.subject{min-height:190px;display:flex;flex-direction:column;justify-content:space-between}.subject h3{margin:8px 0 5px}.subject p{color:var(--muted);font-size:14px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--brand2);font-size:12px;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:9px}.primary{background:var(--brand);color:#fff;padding:10px 15px;border-radius:10px;font-weight:700}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);padding:10px 15px;border-radius:10px;font-weight:700}.primary:hover{background:var(--brand2)}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.sectionTitle h2{margin:0}.muted{color:var(--muted)}.setup{max-width:780px;margin:25px auto}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field select,.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.mode{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode button{text-align:left;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff}.mode button.active{border-color:var(--brand);background:var(--soft)}.testbar{position:sticky;top:69px;background:#fff;border-bottom:1px solid var(--line);z-index:8;padding:10px 18px}.testbarin{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.timer{font-weight:800;font-variant-numeric:tabular-nums}.testgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}.qnum{color:var(--brand);font-weight:800;font-size:13px}.qtext{font-size:19px;line-height:1.5;margin:12px 0 20px}.option{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:1px solid var(--line);background:#fff;border-radius:11px}.option.selected{border-color:var(--brand);background:var(--soft)}.option.correct{border-color:var(--good);background:#edf9f3}.option.wrong{border-color:var(--bad);background:#fff0ee}.palette{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;height:max-content;position:sticky;top:125px}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.num{padding:8px;border-radius:8px;background:#eef1f5;color:#394150}.num.done{background:#dcefe8}.num.current{outline:2px solid var(--brand)}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.resultHero{text-align:center;padding:30px}.score{font-size:54px;font-weight:900;color:var(--brand)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{font-size:25px;display:block}.review{padding:14px;border-bottom:1px solid var(--line)}.review:last-child{border:0}.bar{height:9px;background:#e8ebf1;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--brand)}.footer{padding:35px 18px;text-align:center;color:var(--muted);font-size:12px}.danger{color:var(--bad)}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.testgrid{grid-template-columns:1fr}.palette{position:static}.stats{grid-template-columns:1fr 1fr}.testbar{top:63px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding:23px}.hero h1{font-size:28px}.top{padding:15px}.wrap{margin-top:18px}.mode{grid-template-columns:1fr}.qcard{padding:17px}.qtext{font-size:17px}.stats{grid-template-columns:1fr 1fr}.testbarin{align-items:flex-start}.testbarin .muted{display:none}}
</style>
</head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" src="questions.js"></script>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const subjects=window.CBSE_BANK||{};
const specs={Maths:{code:'041',timer:180,target:38,chapters:['Real Numbers','Polynomials','Pair of Linear Equations','Quadratic Equations','Arithmetic Progressions','Triangles','Coordinate Geometry','Introduction to Trigonometry','Applications of Trigonometry','Circles','Areas Related to Circles','Surface Areas and Volumes','Statistics','Probability']},Science:{code:'086',timer:180,target:39,chapters:['Chemical Reactions','Acids Bases and Salts','Metals and Non-metals','Carbon Compounds','Life Processes','Control and Coordination','Reproduction','Heredity','Light','Human Eye','Electricity','Magnetic Effects','Our Environment']},'Social Science':{code:'087',timer:180,target:38,chapters:['The Rise of Nationalism in Europe','Nationalism in India','Making of a Global World','Print Culture','Resources and Development','Forest and Wildlife','Water Resources','Agriculture','Manufacturing Industries','Power Sharing','Federalism','Gender Religion and Caste','Political Parties','Outcomes of Democracy','Development','Sectors of Economy','Money and Credit','Globalisation']},English:{code:'184',timer:180,target:11,chapters:['Reading Skills','Writing Skills','Grammar','First Flight','Footprints Without Feet']},French:{code:'018',timer:180,target:34,chapters:['Compréhension','Production écrite','Grammaire','Culture et civilisation','Communication']},'Artificial Intelligence':{code:'417',timer:120,target:21,chapters:['Introduction to AI','AI Project Cycle','Data Literacy','Computer Vision','NLP','Evaluation','Employability Skills']}};
function App(){const [screen,setScreen]=useState('home'),[subject,setSubject]=useState(null),[mode,setMode]=useState('full'),[practice,setPractice]=useState(false),[test,setTest]=useState(null),[history,setHistory]=useState(()=>JSON.parse(localStorage.getItem('cbse-history')||'[]'));
const start=(s,m='full',p=false)=>{setSubject(s);setMode(m);setPractice(p);setScreen('setup')};
const begin=(count,mins)=>{const bank=(subjects[subject]||[]);const chosen=shuffle([...bank]).slice(0,Math.min(count,bank.length));setTest({questions:chosen,index:0,answers:{},marked:{},seconds:mins*60,started:Date.now(),title:mode==='full'?`${subject} Board Mock`:`${subject} Practice`});setScreen('test')};
const finish=(t)=>{let score=0;t.questions.forEach((q,i)=>{if(t.answers[i]===q.answer)score+=q.marks||1});const attempt={id:Date.now(),subject,mode,score,total:t.questions.reduce((a,q)=>a+(q.marks||1),0),date:new Date().toLocaleString(),answers:t.answers,questions:t.questions};const h=[attempt,...history].slice(0,30);setHistory(h);localStorage.setItem('cbse-history',JSON.stringify(h));setTest(null);setScreen('results');setLast(attempt)};
const [last,setLast]=useState(null);
if(screen==='home')return <><Header/><main className="wrap"><section className="hero"><h1>Class 10 CBSE Master Prep</h1><p>A serious practice and board-readiness platform for NCERT-based preparation. Choose a subject, train by chapter, or sit a timed board-style mock.</p></section><div className="sectionTitle"><h2>Subjects</h2><span className="muted">2025–26 framework foundation</span></div><div className="grid">{Object.entries(specs).map(([s,x])=><div className="card subject" key={s}><div><span className="pill">Code {x.code}</span><h3>{s}</h3><p>{x.chapters.length} mapped areas · {x.timer} min board timer · {x.target} board-format questions</p></div><div className="actions"><button className="primary" onClick={()=>start(s)}>Full Mock</button><button className="secondary" onClick={()=>start(s,'chapter',true)}>Chapter Practice</button></div></div>)}</div><section className="card" style={{marginTop:18}}><h3>Assessment engine</h3><p className="muted">Question types are stored with marks, answer keys, chapter tags, competency levels and explanations. The engine is designed to grow into the full question bank without copying a handful of questions into artificial variants.</p><div className="actions"><button className="secondary" onClick={()=>setScreen('analytics')}>View Performance</button></div></section></main><Footer/></>;
if(screen==='setup')return <><Header/><main className="wrap"><div className="card setup"><span className="pill">{subject}</span><h2>{mode==='full'?'Board-style full mock':'Chapter practice'}</h2><p className="muted">{mode==='full'?`${specs[subject].target} questions · ${specs[subject].timer} minutes`:'Focused 30-minute practice session'}</p>{mode==='chapter'&&<div className="field"><label>Chapter / skill area</label><select><option>Mixed chapters</option>{specs[subject].chapters.map(c=><option key={c}>{c}</option>)}</select></div>}<div className="field"><label>Mode</label><div className="mode"><button className={!practice?'active':''} onClick={()=>setPractice(false)}><b>Exam mode</b><br/><span className="muted">Timer, no immediate answers</span></button><button className={practice?'active':''} onClick={()=>setPractice(true)}><b>Practice mode</b><br/><span className="muted">Immediate feedback</span></button></div></div><div className="actions"><button className="primary" onClick={()=>begin(mode==='full'?specs[subject].target:15,mode==='full'?specs[subject].timer:30)}>Start Test</button><button className="secondary" onClick={()=>setScreen('home')}>Back</button></div></div></main></>;
if(screen==='test')return <Test test={test} setTest={setTest} practice={practice} finish={finish} subject={subject}/>;
if(screen==='results')return <Results attempt={last} onHome={()=>setScreen('home')}/>;
return <Analytics history={history} onHome={()=>setScreen('home')}/>}
function Header(){return <header className="top"><div className="topin"><div><div className="brand">CBSE Master Prep</div><div className="tag">Class 10 · NCERT · Board Readiness</div></div><button className="secondary" onClick={()=>location.reload()}>Home</button></div></header>}
function Test({test,setTest,practice,finish,subject}){const q=test.questions[test.index];useEffect(()=>{if(test.seconds<=0){finish(test);return}const id=setInterval(()=>setTest(t=>({...t,seconds:t.seconds-1})),1000);return()=>clearInterval(id)},[test.seconds]);const choose=v=>{setTest(t=>({...t,answers:{...t.answers,[t.index]:v}}))};const next=()=>setTest(t=>({...t,index:Math.min(t.questions.length-1,t.index+1)}));const prev=()=>setTest(t=>({...t,index:Math.max(0,t.index-1)}));const mins=String(Math.floor(test.seconds/60)).padStart(2,'0'),secs=String(test.seconds%60).padStart(2,'0');return <><div className="testbar"><div className="testbarin"><div><b>{subject}</b> <span className="muted">· {test.title}</span></div><div className="timer">{mins}:{secs}</div><button className="primary" onClick={()=>{if(confirm('Submit this test now?'))finish(test)}}>Submit</button></div></div><main className="wrap"><div className="testgrid"><section><div className="qcard"><div className="qnum">Question {test.index+1} of {test.questions.length} · {q.type} · {q.marks||1} mark{(q.marks||1)>1?'s':''}</div><div className="qtext">{q.text}</div>{q.options?.map((o,i)=><button key={i} className={'option '+(test.answers[test.index]===i?'selected':'')} onClick={()=>choose(i)}>{String.fromCharCode(65+i)}. {o}</button>)}{!q.options&&<textarea style={{width:'100%',minHeight:160,padding:12,border:'1px solid var(--line)',borderRadius:10}} placeholder="Write your answer here..." value={test.answers[test.index]||''} onChange={e=>choose(e.target.value)}/>} {practice&&test.answers[test.index]!==undefined&&q.options&&<div className="card" style={{marginTop:16}}><b>{test.answers[test.index]===q.answer?'Correct':'Review this'}</b><p className="muted">{q.explanation}</p></div>}<div className="nav"><button className="secondary" onClick={prev} disabled={test.index===0}>Previous</button><button className="primary" onClick={next} disabled={test.index===test.questions.length-1}>Next</button></div></div></section><aside className="palette"><b>Question palette</b><p className="muted">Answered: {Object.keys(test.answers).length}/{test.questions.length}</p><div className="nums">{test.questions.map((_,i)=><button key={i} className={'num '+(test.answers[i]!==undefined?'done ':'')+(i===test.index?'current':'')} onClick={()=>setTest(t=>({...t,index:i}))}>{i+1}</button>)}</div></aside></div></main></>}
function Results({attempt,onHome}){const pct=Math.round(attempt.score/attempt.total*100);return <><Header/><main className="wrap"><div className="card resultHero"><div className="muted">{attempt.subject} · {attempt.mode==='full'?'Full Mock':'Practice'}</div><div className="score">{attempt.score}/{attempt.total}</div><h2>{pct}%</h2><p className="muted">Attempt saved locally on this device.</p><button className="primary" onClick={onHome}>Back to Dashboard</button></div><div className="card" style={{marginTop:18}}><h3>Question review</h3>{attempt.questions.map((q,i)=><div className="review" key={i}><b>Q{i+1}. </b>{q.text}<div className="muted">Your answer: {q.options?.[attempt.answers[i]]||attempt.answers[i]||'Not answered'} · Correct: {q.options?.[q.answer]||q.answerText||q.answer}</div></div>)}</div></main></>}
function Analytics({history,onHome}){const total=history.reduce((a,x)=>a+x.score,0),possible=history.reduce((a,x)=>a+x.total,0);return <><Header/><main className="wrap"><div className="sectionTitle"><h2>Performance</h2><button className="secondary" onClick={onHome}>Dashboard</button></div><div className="stats"><div className="card stat"><span className="muted">Attempts</span><strong>{history.length}</strong></div><div className="card stat"><span className="muted">Overall</span><strong>{possible?Math.round(total/possible*100):0}%</strong></div><div className="card stat"><span className="muted">Best score</span><strong>{history.length?Math.max(...history.map(x=>Math.round(x.score/x.total*100))):0}%</strong></div><div className="card stat"><span className="muted">Subjects tried</span><strong>{new Set(history.map(x=>x.subject)).size}</strong></div></div><div className="card" style={{marginTop:18}}><h3>Recent attempts</h3>{history.length?history.map(x=><div className="review" key={x.id}><b>{x.subject}</b> · {x.mode} · {x.score}/{x.total}<span className="muted"> · {x.date}</span></div>):<p className="muted">No attempts yet.</p>}</div></main></>}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function Footer(){return <div className="footer">Built as a Class 10 CBSE/NCERT preparation platform. Always cross-check the latest CBSE circulars, syllabus, SQPs and marking schemes for the examination year.</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
